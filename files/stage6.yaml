# stage6.yaml — Fire simulation & SUMO hazard integration

simfire_config_path: "data/simfire_toulouse_scenario.yaml"
# path, required. simfire scenario configuration file.
# source: simfire documentation.

ignition_edges_path: "data/red_zone_top_bottom_edges.geojson"
# path, required. Top and bottom edges of the red (disaster) zone polygon used as
# simfire ignition points.
# source: original spec; derived from Stage 1 output.

src_crs: "EPSG:4326"
# EPSG code, string. simfire's native output CRS.
# source: simfire docs — to be confirmed empirically (see risk register R-04).

sumo_crs: "EPSG:2154"
# EPSG code, string. Target CRS = SUMO network's default CRS (Step 0 answer 8).
# Must match base.yaml's `crs` value.
# source: Step 0 answer 8.

poi_size: 50.0
# float, meters, > 0. Width/height of the fire POI marker in the generated .add.xml.
# source: original spec example value.

output_add_xml_path: "outputs/stage6/fire_hazard.add.xml"
# path. Output location for the generated SUMO additional file.
# source: engineering default.
