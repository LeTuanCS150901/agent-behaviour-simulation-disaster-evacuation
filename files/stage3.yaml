# stage3.yaml — Shelter allocation (p-median)

shelter_capacity_slack: 0.10
# fraction, >= 0. Extra total shelter capacity beyond total demand, e.g. 0.10 = 10% slack.
# source: original spec ("slightly larger" — quantified as an assumption needing validation).

solver: "pulp"
# enum {pulp, ortools}. MIP solver backend for the p-median formulation.
# source: engineering default.

solve_granularity: "zone"
# enum {zone, agent}. Whether the p-median problem is solved at zone-aggregate or
# individual-agent granularity.
# source: assumption — needs validation (affects solve time; see risk register R-06).

optimality_gap_tolerance: 0.0
# fraction, >= 0. Maximum acceptable MIP optimality gap. 0.0 requires an exact/proven-optimal
# solve; raise only if a heuristic/relaxed solve is explicitly approved.
# source: engineering default.
