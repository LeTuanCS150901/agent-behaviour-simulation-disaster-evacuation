simfire_engineer_contract:
  input_directory_policy:
    network_relative_path: inputs/network/manhattan.net.xml
    common_config_relative_path: inputs/config/common_manhattan_test.yaml
    preserve_inputs_read_only: true
  output_directory: outputs/manhattan-fire-handoff-interacting-fronts-v007__cfg-aac09958ec29
  required_work:
  - document every effective fire parameter before export
  - verify the common config and network hashes
  - reuse the accepted canonical arrays only if every scientific fire field matches exactly
  - otherwise stop and report all mismatches before any new scientific run
  - produce the full portable artifact contract
  - produce fire.add.xml for visualization only
  - validate all exact cardinalities, geometry, orientation, states, hashes, and provenance
  forbidden_work:
  - do not run Stages 3, 4, or 5
  - do not run the evacuation simulation
  - do not modify installed SimFire
  - do not modify the common configuration
  - do not claim calibrated or Toulouse-valid fire behavior
  - do not encode time using unsupported SUMO additional-file attributes
current_codebase_engineer_contract:
  current_codebase_paths:
    common_config: configs/test/common_manhattan_test.yaml
    schema_to_create_or_update: configs/test/schemas/common_manhattan_test.schema.json
    received_fire_handoff_directory: data/external/simfire/manhattan_fire_handoff_v007
    integration_output_directory: outputs/test/manhattan/integration
    final_report: reports/manhattan_stage3_to_stage6_fire_integration.md
  existing_stage_configs:
    stage3: configs/stage3.yaml
    stage4: configs/stage4.yaml
    stage5: configs/stage5.yaml
    stage6: configs/stage6.yaml
    precedence_rule: For this Manhattan integration, this common contract overrides only conflicting test-network,
      clock, fire-input, hazard, and visualization fields. It does not authorize changes to Stage 3 or
      Stage 4 mathematics.
  demand:
    generation_mode: explicit_test_origins
    vehicle_class: passenger
    total_vehicles: 100
    departure_generation:
      method: deterministic_even_linspace
      begin_seconds: 0
      end_seconds: 300
      inclusive_end: true
      assignment_order: origin list order, then vehicle index within each origin
    origins:
    - edge_id: 384649121#0
      num_cars: 50
    - edge_id: 350726028#0
      num_cars: 30
    - edge_id: 464683329#0
      num_cars: 20
  shelters:
    total_capacity: 110
    destinations:
    - edge_id: 542258337#0
      capacity: 60
    - edge_id: 68325062#0
      capacity: 50
  runtime:
    termination_policy: run through t=1800 even if all vehicles arrive earlier, so the complete fire history
      and final GUI diagnostic are verified
    headless_mode:
      use_scientific_fire_table: true
      load_fire_add_xml: false
      call_traci_polygon_api: false
    gui_mode:
      use_scientific_fire_table: true
      load_fire_add_xml: true
      update_fire_polygons_from_active_snapshot: true
    require_headless_gui_scientific_parity: true
  stage5_fire_integration:
    hazard_provider_source: locally recomputed edge_hazard_time_series.parquet
    prohibit_distance_to_fire_model: true
    prohibit_d_max_for_fire_risk: true
    route_utility: U_k(t) = -alpha_t * normalized_travel_time_k(t) - alpha_h * R_k(t)
    shelter_destination_may_change_in_stage5: false
    route_reconsideration_interval_seconds: 60
    require_positive_risk_candidate_route: true
    require_fire_response_in_risk_utility_or_probability: true
  required_outputs:
  - validated_common_manhattan_test.yaml
  - edge_cell_intersections.parquet
  - edge_hazard_time_series.parquet
  - route_risk_time_series.parquet
  - route_choice_decisions.parquet
  - Stage 3 assignment output
  - Stage 4 shelter-choice output
  - SUMO route and trip files
  - headless simulation log
  - GUI simulation log
  - GUI screenshots at t=0,60,600,1200,1800 seconds
  - input/output manifests and SHA256SUMS
  - test results
  - reports/manhattan_stage3_to_stage6_fire_integration.md
  forbidden_work:
  - do not install or run SimFire in the current codebase environment
  - do not calculate risk from fire.add.xml colors or geometry
  - do not modify the received scientific fire tables
  - do not silently interpolate, pad, average, or substitute missing fire data
  - do not modify Stage 3 or Stage 4 mathematics merely to make the demo pass
  - do not claim Toulouse validation or physical fire calibration
