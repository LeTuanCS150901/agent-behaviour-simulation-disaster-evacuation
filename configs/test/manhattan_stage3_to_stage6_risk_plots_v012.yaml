derivation:
  risk_interval_seconds: 60
  arrival_interval_seconds: 1
  fleet_size: 100
  sampling_seed: 42
  sample_size: 9
  sampling_populations: ["all_agents", "risk_exposed_agents"]
  hazard_time_lookup: "previous_snapshot"
  interpolation: "none"
  internal_edge_prefix: ":"
  activity_boundary: "arrival_timestamp_inclusive_pre_movement"
  risk_zero_tolerance: 1.0e-12
  numerical_tolerance: 1.0e-10
  x_axis_anchor: "last_arrival"
  x_axis_offset_seconds: 10
  interval_sensitivity_seconds: [60, 30, 20, 15, 12, 10, 6, 5, 4, 3, 2, 1]

tables:
  directory: "tables"
  per_agent: "per_agent_route_risk_time_series.parquet"
  model: "model_level_route_risk_time_series.parquet"
  arrival: "cumulative_arrival_time_series.parquet"
  cell_ignition: "cell_ignition_time.parquet"
  driven_trace: "driven_route_trace.parquet"
  route_edge_activity: "route_edge_activity_summary.parquet"
  positive_risk_count: "vehicle_positive_risk_count_time_series.parquet"

visualization:
  directory: "figures"
  format: "png"
  dpi: 200
  font_family: "DejaVu Sans"
  grid_color: "#d7dce2"
  grid_alpha: 0.8
  rendering_metadata:
    Creator: "behaviour-eva v012 risk-plots sidecar"
    Description: "Deterministic derived visualization; source scientific tables are immutable"
    Software: "matplotlib"
  arrival:
    enabled: true
    filename: "cumulative_arrival_rate.png"
    figure_size_inches: [12.0, 6.0]
    title: "Cumulative Vehicle Arrival Rate"
    x_label: "Simulation time (minutes)"
    y_label: "Vehicles arrived (% of total fleet)"
    line_width: 2.4
    line_color: "#2ca02c"
    y_limits: [0.0, 100.0]
    annotation_template: "Final arrival rate: {arrival_percentage:.1f}% ({arrived_count}/{fleet_size}); {non_arrived_count} vehicles did not arrive by {simulation_end_seconds:.0f} s"
  per_agent:
    enabled: true
    filenames:
      all_agents: "per_agent_route_risk_all_agents_sample.png"
      risk_exposed_agents: "per_agent_route_risk_exposed_agents_sample.png"
    figure_size_inches: [13.0, 7.5]
    titles:
      all_agents: "Per-Agent Traversed-Route Risk — Uniform Sample from All Agents"
      risk_exposed_agents: "Per-Agent Traversed-Route Risk — Uniform Sample from Risk-Exposed Agents"
    x_label: "Simulation time (seconds)"
    y_label: "Traversed-route risk R_i(t)"
    line_width: 1.8
    color_map: "tab10"
    terminal_marker: "o"
    terminal_marker_size: 5.0
    y_limits: [0.0, 1.0]
    legend_columns: 2
    annotation_template: "60 s sampling detects {sampled_exposed_count} agents; 1 s observations detect {one_second_exposed_count}. {non_arrived_count} vehicles remain active after the last arrival at {last_arrival_seconds:.0f} s. Display ends at {display_end_seconds:.0f} s; simulation ends at {simulation_end_seconds:.0f} s."
  model:
    enabled: true
    filename: "model_level_route_risk.png"
    figure_size_inches: [12.0, 6.5]
    title: "Model-Level Traversed-Route Risk"
    x_label: "Simulation time (seconds)"
    y_label: "R_model(t) = sum of R_i(t) over all agents"
    line_width: 2.4
    line_color: "#d62728"
    terminal_marker: "o"
    terminal_marker_size: 6.0
    y_axis_policy: "zero_to_data_max_with_headroom"
    headroom_fraction: 0.08
    annotation_template: "60 s sampling detects {sampled_exposed_count} agents; 1 s observations detect {one_second_exposed_count}. {non_arrived_count} vehicles remain active after the last arrival at {last_arrival_seconds:.0f} s. Display ends at {display_end_seconds:.0f} s; simulation ends at {simulation_end_seconds:.0f} s."
  positive_risk_vehicle_count:
    enabled: true
    filename: "vehicles_with_positive_route_risk_over_time.png"
    figure_size_inches: [12.0, 6.5]
    title: "Vehicles with Positive Sampled Route Risk Over Time"
    x_label: "Simulation time (seconds)"
    y_label: "Number of vehicles with R_i(t) > 0"
    line_width: 2.4
    line_color: "#d62728"
    line_style: "-"
    marker: "o"
    marker_size: 4.0
    headroom_fraction: 0.15
    annotation_template: "Point-in-time count at each {interval_seconds:.0f}-second sampled R_i(t); not cumulative. Fleet size: {fleet_size}. This is not the one-second remaining-route-risk count."
  spatial_fire_route_map:
    enabled: true
    filename: "spatial_fire_and_driven_route_time_map.png"
    figure_size_inches: [14.0, 12.0]
    title: "Manhattan Fire Ignition and Driven Routes on a Shared Time Scale"
    x_label: "SUMO local x (m)"
    y_label: "SUMO local y (m)"
    trace_source: "driven_path"
    route_rendering: "edge_width_lines"
    include_internal_edges: false
    draw_order: ["network", "fire", "traces", "interaction_marking"]
    road_cells:
      cell_size_m: 50.0
      fill_color: "#e3e7ea"
      alpha: 0.72
      edge_color: "#c8cdd2"
      edge_linewidth: 0.12
      legend_label: "50 m cell crossed by a passenger-routeable road"
    fire_cells:
      alpha: 0.78
      edge_color: "#30343b"
      edge_linewidth: 0.18
      legend_label: "Cell that burns; colour is first ignition time"
    route_lines:
      overlap_measure: "distinct_vehicles_per_edge"
      time_statistic: "median_vehicle_presence_time_seconds"
      width_scale: "linear"
      minimum_width_points: 0.45
      maximum_width_points: 5.0
      alpha: 0.92
      casing_color: "#ffffff"
      casing_alpha: 0.90
      casing_extra_width_points: 0.90
      width_legend_values: [1, 10, 25, 50]
      width_legend_title: "Distinct vehicles using link"
      legend_label: "Driven road link; colour is typical occupancy time"
    interaction_hatch: "////"
    interaction_edge_color: "#202124"
    interaction_linewidth: 0.45
    interaction_legend_label: "First burn during unvalidated interacting-fronts window"
    time_colour:
      vmin_seconds: 0.0
      vmax_seconds: 1800.0
      colormap: "plasma"
      colorbar_label: "Simulation time (seconds): fire ignition and typical link occupancy"
      lightness_samples: 256
      lightness_tolerance: 1.0e-6
    axis_equal: true
    background_color: "#ffffff"
    caption_font_size: 8.0
    caption_bottom_margin_fraction: 0.065
    caption: |-
      Grey squares: 50 m road cells. Coloured squares: first fire ignition. Coloured lines: median vehicle-presence time; width: distinct vehicles.
      Fire and routes share one time scale. Hatched cells: unvalidated interacting-fronts physics.
    origin_destination_overlay:
      enabled: true
      filename: "spatial_fire_and_driven_route_time_map_with_origins_and_destinations.png"
      base_figure_filename: "spatial_fire_and_driven_route_time_map.png"
      expected_base_figure_sha256: "727d15e09114f2d0227f73e0ad8f038935601eec9bb21d7d64460eb81bf26f95"
      title: "Manhattan Fire, Driven Routes, Origins, and Shelter Destinations"
      coordinate_definition: "line_interpolated_midpoint_50_percent_edge_length"
      show_labels: false
      origins:
        marker: "o"
        marker_size_points_squared: 260.0
        face_color: "#00e5ff"
        edge_color: "#111827"
        edge_linewidth: 1.2
        legend_marker_size_points: 10.0
        legend_label: "Evacuation origin"
        label_template: "{location_id}\n{vehicle_count} vehicles"
        label_offset_points: [8.0, 8.0]
      destinations:
        marker: "*"
        marker_size_points_squared: 480.0
        face_color: "#39ff14"
        edge_color: "#111827"
        edge_linewidth: 1.2
        legend_marker_size_points: 13.0
        legend_label: "Shelter destination"
        label_template: "{location_id}\ncapacity {capacity}"
        label_offset_points: [9.0, -18.0]
      zorder_offset: 1.0
      label_font_size: 8.5
      label_font_weight: "bold"
      label_text_color: "#111827"
      label_box_color: "#ffffff"
      label_box_alpha: 0.88
      legend_title: "Configured endpoints"
      legend_location: "upper right"
      legend_frame_alpha: 0.94

